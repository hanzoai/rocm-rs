# Rust bindings to the ROCm stack (HIP, rocBLAS, rocFFT, MIOpen, …).
#
# Gate: the crate compiles against the bindings committed under src/*/bindings.rs.
# SKIP_BINDGEN is the escape build.rs itself declares for exactly this case — a
# host with no /opt/rocm regenerates nothing and uses the checked-in bindings, so
# what CI proves is that the Rust in this repo compiles against the bindings this
# repo ships. Regenerating them needs ROCm headers and an AMD host; that is a
# hardware lane, not a push gate.
#
# Features are the default set minus `gpu-sort`, which Cargo.toml documents as
# the one to turn off where "the kernel's nested nightly+build-std cargo build is
# unavailable" — a stock runner is precisely that host. Leaving it on would make
# this gate report on the absence of a nightly amdgcn toolchain rather than on
# the code.
test:
  - name: build
    run: |
      set -euo pipefail
      SKIP_BINDGEN=1 cargo build --locked --no-default-features --features macros,miopen
